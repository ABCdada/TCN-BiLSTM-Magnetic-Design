name: Feature request
description: Propose a focused improvement to the released inference and evaluation project.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This repository currently focuses on inference, evaluation, and circuit-level
        examples. A request for training or transfer learning should state the data,
        licensing, split, and reproducibility requirements explicitly.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inference or model support
        - Evaluation or result export
        - Circuit or converter integration
        - Web/API/CLI usability
        - Training or transfer-learning reproducibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the practical limitation without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, outputs, and acceptance criteria.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Data and validation plan
      description: For modeling changes, identify datasets, independent splits, metrics, and licenses.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this capability.
          required: true
        - label: The request does not require sharing data or weights without permission.
          required: true

