name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q app.py cli.py magnetic_model scripts

      - name: Run tests that do not require released checkpoints
        # The excluded test intentionally verifies the private checkpoint files.
        # All other tests either use synthetic/dummy parameters or test pure logic.
        run: python -m pytest -q --ignore=tests/test_checkpoint_integrity.py

      - name: Build wheel and source distribution
        run: python -m build --outdir ci_dist

      - name: Validate the built wheel from outside the source tree
        shell: bash
        run: |
          wheel_path="$(find ci_dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install --force-reinstall --no-deps "$wheel_path"
          manifest_dir="$(mktemp -d)"
          cp weights/manifest.json "$manifest_dir/manifest.json"
          (
            cd /tmp
            MAGNET_MODEL_DIR="$manifest_dir" python - <<'PY'
          import app
          import cli
          import magnetic_model

          client = app.app.test_client()
          assert client.get("/health").status_code == 200
          assert client.get("/api/models").status_code == 200
          assert set(magnetic_model.MATERIALS) == {"A", "B", "C", "D", "E"}
          assert callable(cli.main)
          PY
          )

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: ci_dist/
          if-no-files-found: error
