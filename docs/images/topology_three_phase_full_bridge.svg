<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual three-phase full-bridge converter topology</title>
  <desc id="desc">A two-level DC link supplies three switching legs. Phase outputs pass through three magnetic filter inductors to a three-phase grid.</desc>
  <defs><style>.t{font:700 27px Arial,sans-serif;fill:#17324d}.h{font:700 16px Arial,sans-serif;fill:#17324d}.b{font:14px Arial,sans-serif;fill:#36546b}.wire{stroke:#294f6d;stroke-width:3.5;fill:none}.sw{fill:#e7f2fb;stroke:#315b7d;stroke-width:2}.core{fill:#fdecef;stroke:#9e4b5f;stroke-width:2.5}</style></defs>
  <rect width="1000" height="600" fill="#f7fafc"/>
  <text x="500" y="48" text-anchor="middle" class="t">Three-Phase Full Bridge</text>
  <text x="500" y="76" text-anchor="middle" class="b">Three two-level bridge legs with phase filter inductors</text>
  <line x1="120" y1="130" x2="620" y2="130" class="wire"/><line x1="120" y1="470" x2="620" y2="470" class="wire"/>
  <circle cx="78" cy="300" r="48" fill="#fff7e6" stroke="#b47722" stroke-width="3"/>
  <text x="78" y="294" text-anchor="middle" class="h">DC</text><text x="78" y="316" text-anchor="middle" class="b">link</text>
  <line x1="78" y1="252" x2="78" y2="130" class="wire"/><line x1="78" y1="348" x2="78" y2="470" class="wire"/>

  <g>
    <rect x="180" y="174" width="62" height="70" rx="7" class="sw"/><rect x="180" y="356" width="62" height="70" rx="7" class="sw"/>
    <rect x="340" y="174" width="62" height="70" rx="7" class="sw"/><rect x="340" y="356" width="62" height="70" rx="7" class="sw"/>
    <rect x="500" y="174" width="62" height="70" rx="7" class="sw"/><rect x="500" y="356" width="62" height="70" rx="7" class="sw"/>
    <text x="211" y="217" text-anchor="middle" class="h">A+</text><text x="211" y="399" text-anchor="middle" class="h">A−</text>
    <text x="371" y="217" text-anchor="middle" class="h">B+</text><text x="371" y="399" text-anchor="middle" class="h">B−</text>
    <text x="531" y="217" text-anchor="middle" class="h">C+</text><text x="531" y="399" text-anchor="middle" class="h">C−</text>
  </g>
  <g class="wire">
    <path d="M211 130 V174 M211 244 V356 M211 426 V470"/><path d="M371 130 V174 M371 244 V356 M371 426 V470"/><path d="M531 130 V174 M531 244 V356 M531 426 V470"/>
  </g>
  <line x1="211" y1="300" x2="650" y2="300" class="wire"/><line x1="371" y1="280" x2="650" y2="280" class="wire"/><line x1="531" y1="320" x2="650" y2="320" class="wire"/>
  <g>
    <ellipse cx="690" cy="280" rx="38" ry="23" class="core" fill-opacity="0.35"/><ellipse cx="690" cy="300" rx="38" ry="23" class="core" fill-opacity="0.35"/><ellipse cx="690" cy="320" rx="38" ry="23" class="core" fill-opacity="0.35"/>
    <line x1="728" y1="280" x2="835" y2="280" class="wire"/><line x1="728" y1="300" x2="835" y2="300" class="wire"/><line x1="728" y1="320" x2="835" y2="320" class="wire"/>
  </g>
  <circle cx="875" cy="300" r="72" fill="#eaf7ef" stroke="#45805f" stroke-width="3"/>
  <path d="M842 276 q16 -28 32 0 t32 0 M842 300 q16 -28 32 0 t32 0 M842 324 q16 -28 32 0 t32 0" stroke="#45805f" stroke-width="2.5" fill="none"/>
  <text x="690" y="379" text-anchor="middle" class="h">La, Lb, Lc</text><text x="875" y="405" text-anchor="middle" class="h">Three-phase grid</text>
  <text x="500" y="540" text-anchor="middle" class="b">Conceptual topology used to explain the deterministic converter-window generator.</text>
</svg>

