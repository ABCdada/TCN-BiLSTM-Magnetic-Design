<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual three-phase T-type three-level converter topology</title>
  <desc id="desc">A split DC link provides positive, neutral, and negative voltage levels. Three T-type switching cells feed magnetic filter inductors and a three-phase grid.</desc>
  <defs><style>.t{font:700 27px Arial,sans-serif;fill:#17324d}.h{font:700 15px Arial,sans-serif;fill:#17324d}.b{font:14px Arial,sans-serif;fill:#36546b}.wire{stroke:#294f6d;stroke-width:3.3;fill:none}.sw{fill:#e7f2fb;stroke:#315b7d;stroke-width:2}.neutral{stroke:#b47722;stroke-width:3;stroke-dasharray:10 7}.core{fill:#fdecef;stroke:#9e4b5f;stroke-width:2.5}</style></defs>
  <rect width="1000" height="640" fill="#f7fafc"/>
  <text x="500" y="45" text-anchor="middle" class="t">Three-Phase T-Type Three-Level Bridge</text>
  <text x="500" y="73" text-anchor="middle" class="b">Split DC link and positive / neutral / negative phase states</text>
  <line x1="130" y1="120" x2="620" y2="120" class="wire"/><line x1="130" y1="300" x2="620" y2="300" class="neutral"/><line x1="130" y1="500" x2="620" y2="500" class="wire"/>
  <line x1="92" y1="168" x2="92" y2="252" class="wire"/><line x1="74" y1="202" x2="110" y2="202" class="wire"/><line x1="79" y1="218" x2="105" y2="218" class="wire"/>
  <line x1="92" y1="348" x2="92" y2="432" class="wire"/><line x1="74" y1="382" x2="110" y2="382" class="wire"/><line x1="79" y1="398" x2="105" y2="398" class="wire"/>
  <line x1="92" y1="120" x2="92" y2="168" class="wire"/><line x1="92" y1="252" x2="92" y2="348" class="wire"/><line x1="92" y1="300" x2="130" y2="300" class="neutral"/><line x1="92" y1="432" x2="92" y2="500" class="wire"/>
  <text x="46" y="214" class="h">C1</text><text x="46" y="394" class="h">C2</text><text x="137" y="290" class="h">N</text>

  <g>
    <rect x="185" y="150" width="58" height="58" rx="6" class="sw"/><rect x="185" y="412" width="58" height="58" rx="6" class="sw"/><rect x="185" y="268" width="58" height="58" rx="6" class="sw"/>
    <rect x="345" y="150" width="58" height="58" rx="6" class="sw"/><rect x="345" y="412" width="58" height="58" rx="6" class="sw"/><rect x="345" y="268" width="58" height="58" rx="6" class="sw"/>
    <rect x="505" y="150" width="58" height="58" rx="6" class="sw"/><rect x="505" y="412" width="58" height="58" rx="6" class="sw"/><rect x="505" y="268" width="58" height="58" rx="6" class="sw"/>
    <text x="214" y="185" text-anchor="middle" class="h">A+</text><text x="214" y="303" text-anchor="middle" class="h">A0</text><text x="214" y="447" text-anchor="middle" class="h">A−</text>
    <text x="374" y="185" text-anchor="middle" class="h">B+</text><text x="374" y="303" text-anchor="middle" class="h">B0</text><text x="374" y="447" text-anchor="middle" class="h">B−</text>
    <text x="534" y="185" text-anchor="middle" class="h">C+</text><text x="534" y="303" text-anchor="middle" class="h">C0</text><text x="534" y="447" text-anchor="middle" class="h">C−</text>
  </g>
  <g class="wire">
    <path d="M214 120 V150 M214 208 V257 M214 326 V412 M214 470 V500"/><path d="M374 120 V150 M374 208 V257 M374 326 V412 M374 470 V500"/><path d="M534 120 V150 M534 208 V257 M534 326 V412 M534 470 V500"/>
  </g>
  <line x1="130" y1="300" x2="185" y2="297" class="neutral"/><line x1="243" y1="297" x2="345" y2="297" class="neutral"/><line x1="403" y1="297" x2="505" y2="297" class="neutral"/>
  <line x1="214" y1="257" x2="650" y2="257" class="wire"/><line x1="374" y1="237" x2="650" y2="237" class="wire"/><line x1="534" y1="277" x2="650" y2="277" class="wire"/>
  <ellipse cx="690" cy="237" rx="38" ry="22" class="core" fill-opacity="0.35"/><ellipse cx="690" cy="257" rx="38" ry="22" class="core" fill-opacity="0.35"/><ellipse cx="690" cy="277" rx="38" ry="22" class="core" fill-opacity="0.35"/>
  <line x1="728" y1="237" x2="827" y2="237" class="wire"/><line x1="728" y1="257" x2="827" y2="257" class="wire"/><line x1="728" y1="277" x2="827" y2="277" class="wire"/>
  <circle cx="870" cy="257" r="70" fill="#eaf7ef" stroke="#45805f" stroke-width="3"/>
  <path d="M837 233 q16 -27 32 0 t32 0 M837 257 q16 -27 32 0 t32 0 M837 281 q16 -27 32 0 t32 0" stroke="#45805f" stroke-width="2.5" fill="none"/>
  <text x="690" y="350" text-anchor="middle" class="h">Three filter inductors</text><text x="870" y="356" text-anchor="middle" class="h">Three-phase grid</text>
  <rect x="214" y="539" width="572" height="58" rx="12" fill="#fff7e6" stroke="#b47722"/>
  <text x="500" y="564" text-anchor="middle" class="b">Conceptual three-level switching states only; neutral-point control and device loss are not modeled.</text>
  <text x="500" y="585" text-anchor="middle" class="b">AI inference is applied after the deterministic 1,000-sample state window is generated.</text>
</svg>

